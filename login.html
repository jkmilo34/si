<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIPAE - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <!-- Avatar -->
            <div class="avatar">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="50" fill="#5a3a6a"/>
                    <circle cx="50" cy="35" r="15" fill="#e0e0e0"/>
                    <path d="M 30 65 Q 30 50 50 50 Q 70 50 70 65 L 70 85 Q 70 85 50 85 Q 30 85 30 65" fill="#e0e0e0"/>
                </svg>
            </div>

            <h2 class="auth-title">CHIPAE</h2>
            <p class="auth-subtitle">Inicia sesión en tu cuenta</p>

            <!-- Formulario -->
            <form id="loginForm" class="auth-form">
                <!-- Usuario -->
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <!-- Recordarme y Olvide contraseña -->
                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="forgot-password" title="Próximamente">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Login -->
                <button type="submit" class="btn btn-submit">INGRESAR</button>
            </form>

            <!-- Enlace a Registro -->
            <div class="auth-link">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>

            <!-- Volver al inicio -->
            <div class="back-link">
                <a href="index.html">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
