<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIPAE - Login</title>
    <style>
        /* ===== RESET Y VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #1a0033;
            --primary-purple: #2d0f3a;
            --primary-accent: #4a1a5c;
            --secondary-accent: #3d1a47;
            --gold: #d4a574;
            --gold-bright: #ffd700;
            --text-light: #e0e0e0;
            --text-gray: #c0c0c0;
            --text-input: #333;
            --bg-input: #e0e0e0;
            --error: #f44336;
            --success: #4caf50;
            --border-dark: #5a2a66;
            --transition: all 0.3s ease;
        }

        /* ===== BODY Y FONDO ===== */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-purple) 25%, var(--primary-accent) 50%, var(--secondary-accent) 75%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efecto de fondo animado */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(212, 165, 116, 0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
            z-index: 0;
        }

        /* ===== CONTENEDOR LOGIN ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: rgba(30, 10, 50, 0.9);
            padding: 50px 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(212, 165, 116, 0.3), 0 0 60px rgba(74, 26, 92, 0.4), inset 0 0 30px rgba(212, 165, 116, 0.1);
            border: 2px solid var(--gold);
            backdrop-filter: blur(10px);
        }

        /* ===== TITULO Y AVATAR ===== */
        .login-title {
            text-align: center;
            color: var(--gold-bright);
            font-size: 1.8em;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7a4a8a, #4a2a6a);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.4), inset 0 0 20px rgba(212, 165, 116, 0.2);
            border: 3px solid var(--gold);
            animation: float 3s ease-in-out infinite;
        }

        .avatar svg {
            width: 100%;
            height: 100%;
        }

        /* ===== FORMULARIO ===== */
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--bg-input);
            border-radius: 5px;
            overflow: hidden;
            border-left: 4px solid var(--gold);
            transition: var(--transition);
        }

        .input-group:focus-within {
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.4);
            border-left-color: var(--gold-bright);
        }

        .input-group .icon {
            padding: 12px 15px;
            font-size: 1.2em;
            color: var(--secondary-accent);
        }

        .input-group input {
            flex: 1;
            border: none;
            padding: 12px 15px;
            background-color: var(--bg-input);
            color: var(--text-input);
            font-size: 1em;
            outline: none;
            transition: var(--transition);
        }

        .input-group input::placeholder {
            color: #999;
        }

        .input-group input:focus {
            background-color: #f0f0f0;
        }

        /* ===== OPCIONES (RECORDARME Y OLVIDE CONTRASEÑA) ===== */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            margin-top: 5px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember {
            display: flex;
            align-items: center;
            color: var(--text-gray);
            cursor: pointer;
            gap: 8px;
            transition: var(--transition);
        }

        .remember:hover {
            color: var(--gold);
        }

        .remember input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--gold);
        }

        .forgot-password {
            color: var(--gold);
            text-decoration: none;
            font-style: italic;
            transition: var(--transition);
        }

        .forgot-password:hover {
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
        }

        /* ===== BOTÓN LOGIN ===== */
        .login-btn {
            padding: 14px;
            background: linear-gradient(135deg, #2d1f3d 0%, #3d2a4d 100%);
            color: var(--gold);
            border: 2px solid var(--gold);
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 5px;
            transition: var(--transition);
            margin-top: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.2);
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #3d2a4d 0%, #4d3a5d 100%);
            color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.6);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.3);
        }

        /* ===== ENLACES ===== */
        .signup-link, .back-link {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.9em;
        }

        .signup-link {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-dark);
        }

        .signup-link a, .back-link a {
            color: var(--gold);
            text-decoration: none;
            transition: var(--transition);
            font-weight: bold;
        }

        .signup-link a:hover, .back-link a:hover {
            color: var(--gold-bright);
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
        }

        .back-link {
            margin-top: 10px;
            font-size: 0.85em;
        }

        /* ===== NOTIFICACIONES ===== */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            font-weight: bold;
            max-width: 300px;
            word-wrap: break-word;
        }

        .notification.error {
            background: var(--error);
        }

        .notification.success {
            background: var(--success);
        }

        /* ===== ANIMACIONES ===== */
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .login-box {
                padding: 30px 20px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                margin-bottom: 15px;
            }

            .login-title {
                font-size: 1.5em;
            }

            .login-btn {
                padding: 12px;
                font-size: 1em;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
            }

            .notification {
                max-width: 90vw;
                right: 5vw;
                left: auto;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Avatar -->
            <div class="avatar">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="50" fill="#5a3a6a"/>
                    <circle cx="50" cy="35" r="15" fill="#e0e0e0"/>
                    <path d="M 30 65 Q 30 50 50 50 Q 70 50 70 65 L 70 85 Q 70 85 50 85 Q 30 85 30 65" fill="#e0e0e0"/>
                </svg>
            </div>

            <h2 class="login-title">CHIPAE</h2>

            <!-- Formulario -->
            <form id="loginForm">
                <!-- Usuario -->
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="username" placeholder="Usuario" required>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>

                <!-- Recordarme y Olvide contraseña -->
                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón Login -->
                <button type="submit" class="login-btn">INGRESAR</button>
            </form>

            <!-- Enlace a Registro -->
            <div class="signup-link">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>

            <!-- Volver al inicio -->
            <div class="back-link">
                <a href="otro.html">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        /* ===== CONSTANTES Y ELEMENTOS ===== */
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        /* ===== FUNCIÓN UNIFICADA DE NOTIFICACIONES ===== */
        function showNotification(message, type = 'error') {
            const notification = document.createElement('div');
            notification.classList.add('notification', type);
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 4000);
        }

        /* ===== CARGAR DATOS GUARDADOS ===== */
        window.addEventListener('load', function() {
            const savedUsername = localStorage.getItem('savedUsername');
            if (savedUsername && localStorage.getItem('rememberMe') === 'true') {
                usernameInput.value = savedUsername;
                rememberMeCheckbox.checked = true;
            }
        });

        /* ===== VALIDAR FORMULARIO ===== */
        function validateForm(username, password) {
            if (!username.trim()) {
                showNotification('Por favor ingresa un usuario', 'error');
                usernameInput.focus();
                return false;
            }

            if (!password.trim()) {
                showNotification('Por favor ingresa tu contraseña', 'error');
                passwordInput.focus();
                return false;
            }

            const registeredUser = localStorage.getItem('user_' + username);
            if (!registeredUser) {
                showNotification('El usuario no existe. Por favor regístrate primero.', 'error');
                usernameInput.focus();
                return false;
            }

            const userData = JSON.parse(registeredUser);
            if (userData.password !== password) {
                showNotification('Contraseña incorrecta. Intenta de nuevo.', 'error');
                passwordInput.focus();
                return false;
            }

            return true;
        }

        /* ===== MANEJAR ENVÍO DE FORMULARIO ===== */
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!validateForm(username, password)) return;

            // Guardar preferencias
            if (rememberMeCheckbox.checked) {
                localStorage.setItem('savedUsername', username);
                localStorage.setItem('rememberMe', 'true');
            } else {
                localStorage.removeItem('savedUsername');
                localStorage.removeItem('rememberMe');
            }

            // Guardar sesión
            localStorage.setItem('currentUser', username);
            localStorage.setItem('employeeName', username);
            localStorage.setItem('employeeRole', 'Empleado');
            localStorage.setItem('loginTime', new Date().toISOString());

            showNotification(`¡Bienvenido ${username} a CHIPAE!`, 'success');

            // Redirigir después de 1.5 segundos
            setTimeout(() => {
                window.location.href = 'Empleados.html';
            }, 1500);
        });

        /* ===== ENTER PARA ENVIAR FORMULARIO ===== */
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loginForm.submit();
        });

        console.log('Login CHIPAE cargado - Colores inspirados en EVA-01');
    </script>
</body>
</html>
